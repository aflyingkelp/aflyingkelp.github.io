方獣王園","runtimeInstalled":false,"gameDataInstalled":false},{"id":"th20","number":"20","title":"Fossilized Wonders","japanese":"東方錦上京","runtimeInstalled":false,"gameDataInstalled":false}];const id=new URL(location.href).searchParams.get('game');const g=games.find(g=>g.id===id)||games.find(g=>g.id==='th10');document.getElementById('title').textContent='Touhou '+g.number+' · '+g.title;document.getElementById('status').textContent=g.runtimeInstalled?'The browser runtime is installed on this site. Original game data has not been installed.':'This title’s browser runtime and original game assets have not been installed on this site.';document.getElementById('actions').hidden=!g.runtimeInstalled;const s=document.getElementById('game');for(const g of games){const o=document.createElement('option');o.value=g.id;o.textContent=g.number+' · '+g.title;o.selected=g.id===id;s.append(o);}s.addEventListener('change',()=>location.href='play.html?game='+s.value);</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('app-shell-sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});</script></body></html>
